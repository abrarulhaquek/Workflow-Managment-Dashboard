<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">Workflow Dashboard</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a mat-list-item routerLink="/workflows" routerLinkActive="active">Workflows</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <span *ngIf="(userLabel$ | async) as label" class="user">{{ label }}</span>
      <div>
        <button mat-button (click)="toggleTheme()">Theme</button>
        <button mat-button (click)="logout()">Logout</button>
      </div>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<mat-sidenav-container class="shell">
  <mat-sidenav #sidenav [mode]="(isMobile$ | async) ? 'over' : 'side'" [opened]="(isMobile$ | async) === false"
    class="sidenav">
    <div class="brand">Workflow Dashboard</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active"
        (click)="sidenav.mode === 'over' && sidenav.close()">Dashboard</a>
      <a mat-list-item routerLink="/workflows" routerLinkActive="active"
        (click)="sidenav.mode === 'over' && sidenav.close()">Workflows</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" *ngIf="isMobile$ | async">
        <mat-icon>menu</mat-icon>
      </button>

      <span *ngIf="(userLabel$ | async) as label" class="user">{{ label }}</span>
      <div>
        <button mat-button (click)="toggleTheme()">Theme</button>
        <button mat-button (click)="logout()">Logout</button>
      </div>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

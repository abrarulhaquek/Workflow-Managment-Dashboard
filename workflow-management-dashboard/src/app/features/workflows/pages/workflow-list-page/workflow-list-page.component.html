<mat-card class="cards">
  <div class="header">
    <div>
      <mat-card-title>Workflows</mat-card-title>
      <mat-card-subtitle>Search / filter / server-side pagination (mocked)</mat-card-subtitle>
    </div>

    <button mat-flat-button color="primary" (click)="openCreate()" [disabled]="!(canCreate$ | async)">
      Create
    </button>
  </div>

  <form class="filters" [formGroup]="filters">
    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <input matInput formControlName="search" placeholder="Workflow name…" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option [value]="null">All</mat-option>
        <mat-option value="Draft">Draft</mat-option>
        <mat-option value="In Review">In Review</mat-option>
        <mat-option value="Approved">Approved</mat-option>
        <mat-option value="Rejected">Rejected</mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <div class="table-wrap">
    <table mat-table [dataSource]="(workflows$ | async) ?? []" class="mat-elevation-z0">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let w">{{ w.name }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let w">{{ w.status }}</td>
      </ng-container>

      <ng-container matColumnDef="priority">
        <th mat-header-cell *matHeaderCellDef>Priority</th>
        <td mat-cell *matCellDef="let w">{{ w.priority }}</td>
      </ng-container>

      <ng-container matColumnDef="dueDate">
        <th mat-header-cell *matHeaderCellDef>Due</th>
        <td mat-cell *matCellDef="let w">{{ w.dueDate }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let w" class="actions">
          <button mat-button (click)="openEdit(w)" [disabled]="!(canEdit$ | async)">Edit</button>
          <button mat-button color="warn" (click)="delete(w)" [disabled]="!(canDelete$ | async)">Delete</button>
          <button
            mat-button
            color="primary"
            (click)="approve(w)"
            [disabled]="!(canApprove$ | async) || w.status === 'Approved'"
          >
            Approve
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
      
    </table>
  </div>

  <mat-paginator
    [length]="total$ | async"
    [pageIndex]="(query$ | async)?.page! - 1"
    [pageSize]="(query$ | async)?.pageSize!"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (page)="pageChanged($event)"
  />
</mat-card>
